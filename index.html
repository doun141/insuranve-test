    /* ── CARD ── */

    /* ── PROGRESS ── */

    .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .progress-label { font-size: 12px; font-weight: 600; color: var(--gray-600); }
    .progress-count { font-size: 13px; font-weight: 700; color: var(--coral); }
    .progress-track { height: 6px; background: var(--gray-200); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--coral), var(--coral-light)); border-radius: 99px; transition: width 0.4s cubic-bezier(.4,0,.2,1); }

    /* ── BUTTONS ── */
    .btn { display: block; width: 100%; padding: 16px; font-family: var(--font); font-size: 16px; font-weight: 700; border: none; border-radius: 14px; cursor: pointer; transition: all 0.2s ease; letter-spacing: -0.3px; text-align: center; }

    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-kakao:hover { box-shadow: 0 6px 20px rgba(254,229,0,0.5); transform: translateY(-1px); }
    .btn-navy { background: var(--navy); color: white; box-shadow: 0 4px 16px rgba(27,43,94,0.25); }
    .btn-navy:hover { transform: translateY(-1px); }
    .btn-outline { background: transparent; color: var(--gray-600); border: 2px solid var(--gray-200); font-size: 14px; padding: 13px; text-decoration: none; }
    .btn-outline:hover { border-color: var(--gray-400); }
    .btn-retry { background: var(--gray-100); color: var(--navy); font-size: 14px; padding: 14px; border: 2px solid var(--gray-200); }

    .option { display: block; width: 100%; padding: 18px 20px; font-family: var(--font); font-size: 15px; font-weight: 500; border: 2px solid var(--gray-200); border-radius: 14px; background: white; color: var(--navy); cursor: pointer; text-align: left; line-height: 1.5; letter-spacing: -0.3px; -webkit-tap-highlight-color: transparent; outline: none; transition: border-color 0.15s, background 0.15s; }

// ── UTILITIES ──
function getGrade(score) {
  if (score >= 10) return 'pass';
  if (score >= 7)  return 'conditional';
  if (score >= 4)  return 'retake';
  return 'fail';
}

function calcWeakAreas(answers) {
  const map = {};
  answers.forEach((ok, i) => {
    if (!ok) { const a = QUESTIONS[i].area; map[a] = (map[a] || 0) + 1; }
  });
  return Object.entries(map).sort((a,b) => b[1]-a[1]).slice(0,2).map(([a]) => a);
}

function validateForm(f) {
  const e = {};
  if (!f.name.trim()) e.name = '이름을 입력해주세요';
  if (!f.phone.trim()) { e.phone = '연락처를 입력해주세요'; }
  else if (!/^[0-9]{10,11}$/.test(f.phone.replace(/-/g,''))) { e.phone = '올바른 연락처를 입력해주세요 (숫자만)'; }
  if (!f.ga.trim()) e.ga = '소속 GA를 입력해주세요';
  return e;
}

function saveEntry(data) {
  try {
    const list = JSON.parse(localStorage.getItem('helper_entries') || '[]');
    list.push({ ...data, ts: new Date().toISOString() });
    localStorage.setItem('helper_entries', JSON.stringify(list));
  } catch(e) { console.error(e); }
  sendToSheets(data);
}

async function sendToSheets(data) {
  if (SHEETS_WEBHOOK_URL === 'YOUR_APPS_SCRIPT_URL') return;
  try {
    await fetch(SHEETS_WEBHOOK_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        ts: new Date().toLocaleString('ko-KR'),
        name: data.name, phone: data.phone, ga: data.ga,
        grade: data.grade, score: data.score,
        weakAreas: (data.weakAreas||[]).join(', '),
        hasKakao: data.hasKakao ? '✅' : '❌',
      }),
    });
  } catch(e) { console.error('Sheets error:', e); }
}

function showToast(msg) {
  const old = document.getElementById('toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.id = 'toast'; t.textContent = msg;
  Object.assign(t.style, {
    position:'fixed', bottom:'24px', left:'50%',
    transform:'translateX(-50%) translateY(20px)',
    background:'#1B2B5E', color:'white', padding:'13px 22px',
    borderRadius:'99px', fontSize:'13px', fontWeight:'700',
    boxShadow:'0 4px 20px rgba(0,0,0,0.2)', zIndex:'9999',
    opacity:'0', transition:'all 0.3s ease', whiteSpace:'nowrap',
    fontFamily:'var(--font)', letterSpacing:'-0.3px',
  });
  document.body.appendChild(t);
  requestAnimationFrame(() => { t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)'; });
  setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(10px)'; setTimeout(()=>t.remove(),300); }, 3000);
}

// ── KAKAO ──
function initKakao() {
  try { if (window.Kakao && !window.Kakao.isInitialized()) window.Kakao.init(KAKAO_APP_KEY); }
  catch(e) { console.error('Kakao init:', e); }
}

function shareKakao() {
  const result = RESULTS[state.grade];
  const testUrl  = 'https://doun141.github.io/insuranve-test/';
  const imageUrl = 'https://doun141.github.io/insuranve-test/og-image.png';

  if (!window.Kakao?.isInitialized()) { fallbackShare(testUrl); return; }

  try {
    window.Kakao.Share.sendDefault({
      objectType: 'feed',
      content: {
        title: `보험설계사 적성고사: ${result.title} ${result.emoji}`,
        description: `${result.subtitle} · ${state.score}점 / 12점\n나도 해볼래요?`,
        imageUrl: imageUrl,
        imageWidth: 1200,
        imageHeight: 630,
        link: {
          mobileWebUrl: testUrl,
          webUrl: testUrl,
        },
      },
      buttons: [{
        title: '나도 테스트 하기',
        link: {
          mobileWebUrl: testUrl,
          webUrl: testUrl,
        },
      }],
    });
  } catch(e) {
    console.error('Kakao share error:', e);
    fallbackShare(testUrl);
  }
}

function fallbackShare(url) {
  const shareUrl = url || getShareUrl();
  if (navigator.share) {
    navigator.share({ title:'보험설계사 적성 테스트', url: shareUrl }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(shareUrl)
      .then(() => showToast('🔗 링크가 복사되었습니다!'))
      .catch(() => showToast('주소창 링크를 복사해 공유해 주세요'));
  }
}

            <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #E8E8E8;margin-bottom:6px;">
              <span style="font-size:13px;font-weight:600;color:#6B7280;">나의 결과</span>
              <span style="font-weight:800;color:#1B2B5E;">${result.emoji} ${result.title}</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #E8E8E8;margin-bottom:6px;">
              <span style="font-size:13px;font-weight:600;color:#6B7280;">적성 점수</span>
              <span style="font-weight:800;color:${result.color};">${state.score}점 / 12점</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;">
              <span style="font-size:13px;font-weight:600;color:#6B7280;">당첨 확률</span>
              <span style="font-weight:800;color:${oddsColor};">${oddsText}</span>
            </div>
          </div>
          <div class="divider"></div>
          <div class="section-title">🎁 경품 안내</div>
          <div class="prize-list" style="margin-bottom:24px;">
            <div class="prize-item"><div class="prize-rank" style="background:#FFF9DB;">🥇</div><div class="prize-info"><div class="prize-name">에어팟 (4세대)</div><div class="prize-sub">1명</div></div></div>
            <div class="prize-item"><div class="prize-rank" style="background:#F1F3F5;">🥈</div><div class="prize-info"><div class="prize-name">배달의민족 쿠폰 3만원</div><div class="prize-sub">5명</div></div></div>
            <div class="prize-item"><div class="prize-rank" style="background:#FFF0E8;">🥉</div><div class="prize-info"><div class="prize-name">스타벅스 상품권 1만원</div><div class="prize-sub">10명</div></div></div>
          </div>
          <button class="btn btn-kakao" onclick="shareKakao()" style="margin-bottom:10px;">${KAKAO_SVG} 결과 카카오톡으로 공유하기</button>
          <a href="https://docs.thehelper.io/" target="_blank" class="btn btn-outline" style="display:block;text-decoration:none;">간병헬퍼 서비스 더 알아보기 →</a>
        </div>
      </div>
    </div>`;
  return wrap;
}

// ── ACTIONS ──
function startTest() {
  Object.assign(state, { screen:'test', currentQ:0, answers:[], score:0, grade:'', weakAreas:[] });
  render();
}

// 터치 디바이스용 — ghost click 완전 차단
let _touchHandled = false;
function handleOptionTouch(event, val, el) {
  event.preventDefault(); // ghost click 방지 (핵심!)
  el.classList.remove('pressed');
  if (_touchHandled) return;
  _touchHandled = true;
  blockTouchOverlay();   // 새 버튼에 터치 상태 전달 차단
  selectAnswer(val);
  setTimeout(() => { _touchHandled = false; }, 500);
}

// 데스크탑 마우스용
let _mouseHandled = false;
function handleOptionMouse(event, val, el) {
  if (_touchHandled) return; // 터치로 이미 처리된 경우 무시
  if (_mouseHandled) return;
  _mouseHandled = true;
  selectAnswer(val);
  setTimeout(() => { _mouseHandled = false; }, 500);
}

// 새 DOM 렌더 직전 투명 오버레이로 터치 상태 전달 차단
function blockTouchOverlay() {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:all;background:transparent;';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 300);
}

function selectAnswer(val) {
  // 모든 옵션 버튼 즉시 비활성화
  document.querySelectorAll('.option').forEach(b => {
    b.style.pointerEvents = 'none';
    b.classList.remove('pressed');
  });
  state.answers.push(val);
  setTimeout(() => {
    if (state.currentQ < QUESTIONS.length - 1) {
      state.currentQ += 1; render();
    } else {
      state.score = state.answers.reduce((s, v) => s + v, 0);
      state.grade = getGrade(state.score);
      state.weakAreas = calcWeakAreas(state.answers);
      state.screen = 'result';
      render();
    }
  }, 200);
}

function goToApply() { state.screen = 'apply'; render(); }

function updateForm(field, value) {
  state.form[field] = value;
  if (state.errors[field]) delete state.errors[field];
}

function submitApply() {
  const errors = validateForm(state.form);
  state.errors = errors;
  if (Object.keys(errors).length > 0) { render(); return; }
  state.submitting = true; render();
  saveEntry({ name:state.form.name, phone:state.form.phone, ga:state.form.ga, grade:state.grade, score:state.score, weakAreas:state.weakAreas, hasKakao:state.hasKakao });
  setTimeout(() => { state.submitting = false; state.screen = 'complete'; render(); }, 800);
}

function onKakaoLinkClick() { state.kakaoLinkClicked = true; }

function handleVisibilityChange() {
  if (document.visibilityState !== 'visible') return;
  if (state.screen !== 'apply') return;
  if (!state.kakaoLinkClicked || state.hasKakao) return;
  state.hasKakao = true; state.kakaoLinkClicked = false;
  render(); showToast('✅ 채널 추가 확인됐어요! 당첨 확률 UP!');
}

function toggleKakao() { state.hasKakao = !state.hasKakao; render(); }

function handleCheckboxClick() {
  if (!state.kakaoLinkClicked && !state.hasKakao) {
    showToast('먼저 카카오 채널 추가하기 버튼을 눌러주세요!');
    return;
  }
  state.hasKakao = !state.hasKakao;
  render();
}

function retryTest() {
  Object.assign(state, { screen:'intro', currentQ:0, answers:[], score:0, grade:'', weakAreas:[], hasKakao:false, kakaoLinkClicked:false, errors:{} });
  render();
}

// ── URL 파라미터 체크 (공유받은 결과) ──
function checkSharedParams() {
  try {
    const hash = window.location.hash.replace('#', '');
    if (!hash) return;
    const parts = hash.split('/');
    if (parts.length !== 2) return;
    const grade = parts[0];
    const score = parseInt(parts[1]);
    if (RESULTS[grade] && !isNaN(score)) {
      state.sharedGrade = grade;
      state.sharedScore = score;
      state.screen = 'shared';
    }
  } catch(e) { console.error('Param error:', e); }
}

// ── INIT ──
document.addEventListener('visibilitychange', handleVisibilityChange);
initKakao();
setOgMeta();
checkSharedParams();

window.startTest           = startTest;
window.handleOptionTouch   = handleOptionTouch;
window.handleOptionMouse   = handleOptionMouse;
window.goToApply           = goToApply;
window.updateForm       = updateForm;
window.submitApply      = submitApply;
window.onKakaoLinkClick = onKakaoLinkClick;
window.toggleKakao      = toggleKakao;
window.handleCheckboxClick = handleCheckboxClick;
window.retryTest        = retryTest;
window.shareKakao       = shareKakao;

render();
</script>
</body>
</html>
