    if (correct === 0) {
      const area = QUESTIONS[idx].area;
      areaWrong[area] = (areaWrong[area] || 0) + 1;
    }
  });
  return Object.entries(areaWrong)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 2)
    .map(([area]) => area);
}

function validateForm(form) {
  const errors = {};
  if (!form.name.trim()) errors.name = '이름을 입력해주세요';
  if (!form.phone.trim()) {
    errors.phone = '연락처를 입력해주세요';
  } else if (!/^[0-9]{10,11}$/.test(form.phone.replace(/-/g, ''))) {
    errors.phone = '올바른 연락처를 입력해주세요 (숫자만)';
  }
  if (!form.ga.trim()) errors.ga = '소속 GA를 입력해주세요';
  return errors;
}

function saveEntry(data) {
  try {
    const entries = JSON.parse(localStorage.getItem('helper_entries') || '[]');
    entries.push({ ...data, ts: new Date().toISOString() });
    localStorage.setItem('helper_entries', JSON.stringify(entries));
  } catch (e) {
    console.error('LocalStorage error:', e);
  }
  sendToSheets(data);
}

async function sendToSheets(data) {
  if (SHEETS_WEBHOOK_URL === 'YOUR_APPS_SCRIPT_URL') return;
  try {
    const payload = JSON.stringify({
      ts: new Date().toLocaleString('ko-KR'),
      name: data.name,
      phone: data.phone,
      ga: data.ga,
      grade: data.grade,
      score: data.score,
      weakAreas: (data.weakAreas || []).join(', '),
      hasKakao: data.hasKakao ? '✅' : '❌',
    });
    await fetch(SHEETS_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: payload,
    });
  } catch (e) {
    console.error('Sheets error:', e);
  }
}

function showToast(msg) {
  const existing = document.getElementById('toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.id = 'toast';
  toast.textContent = msg;
  Object.assign(toast.style, {
    position:'fixed', bottom:'24px', left:'50%',
    transform:'translateX(-50%) translateY(20px)',
    background:'#1B2B5E', color:'white',
    padding:'13px 22px', borderRadius:'99px',
    fontSize:'13px', fontWeight:'700',
    boxShadow:'0 4px 20px rgba(0,0,0,0.2)',
    zIndex:'9999', opacity:'0', transition:'all 0.3s ease',
    whiteSpace:'nowrap', fontFamily:'var(--font)',
  });
  document.body.appendChild(toast);
  requestAnimationFrame(() => {
    toast.style.opacity = '1';
    toast.style.transform = 'translateX(-50%) translateY(0)';
  });
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(10px)';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

function shareKakao() {
  const result = RESULTS[state.grade];
  if (KAKAO_APP_KEY === 'YOUR_KAKAO_APP_KEY') { fallbackShare(); return; }
  try {
    window.Kakao.Share.sendDefault({
      objectType: 'feed',
      content: {
        title: `나의 보험설계사 적성고사 결과: ${result.title}`,
        description: `${result.subtitle}\n적성 점수: ${state.score}점 / 12점\n\n당신도 한번 해볼래요?`,
        imageUrl: 'https://docs.thehelper.io/og-image.png',

      },
      buttons: [{
        title: '나도 테스트 하기',
        link: { mobileWebUrl: window.location.href, webUrl: window.location.href },
      }],
    });
  } catch (e) {
    console.error('Kakao share error:', e);
    fallbackShare();
  }
}

function fallbackShare() {
  if (navigator.share) {
    navigator.share({ title:'보험설계사 적성고사', url: window.location.href }).catch(() => {});
  } else {
    navigator.clipboard.writeText(window.location.href)
      .then(() => showToast('🔗 링크가 복사되었습니다!'))
      .catch(() => showToast('주소창 링크를 복사해 공유해 주세요'));
  }
}

            <span style="font-weight:800;color:#1B2B5E;">${result.emoji} ${result.title}</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;
                      padding:6px 0;border-bottom:1px solid #E8E8E8;margin-bottom:6px;">
            <span style="font-size:13px;font-weight:600;color:#6B7280;">적성 점수</span>
            <span style="font-weight:800;color:${result.color};">${state.score}점 / 12점</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;">
            <span style="font-size:13px;font-weight:600;color:#6B7280;">당첨 확률</span>
            <span style="font-weight:800;color:${oddsColor};">${oddsText}</span>
          </div>
        </div>

        <div class="divider"></div>
        <div class="section-title">🎁 경품 안내</div>
        <div class="prize-list" style="margin-bottom:24px;">
          <div class="prize-item">
            <div class="prize-rank" style="background:#FFF9DB;">🥇</div>
            <div class="prize-info"><div class="prize-name">에어팟 (4세대)</div><div class="prize-sub">1명</div></div>
          </div>
          <div class="prize-item">
            <div class="prize-rank" style="background:#F1F3F5;">🥈</div>
            <div class="prize-info"><div class="prize-name">스타벅스 상품권 3만원</div><div class="prize-sub">5명</div></div>
          </div>
          <div class="prize-item">
            <div class="prize-rank" style="background:#FFF0E8;">🥉</div>
            <div class="prize-info"><div class="prize-name">배달의민족 쿠폰 1만원</div><div class="prize-sub">10명</div></div>
          </div>
        </div>

        <a href="https://docs.thehelper.io/" target="_blank"
           class="btn btn-outline" style="display:block;text-decoration:none;">
          간병헬퍼 서비스 더 알아보기 →
        </a>
      </div>
    </div>`;
  return wrap;
}

// ==================== ACTIONS ====================
function startTest() {
  state.screen = 'test';
  state.currentQ = 0;
  state.answers = [];
  render();
}

function selectAnswer(val) {
  state.answers.push(val);
  if (state.currentQ < QUESTIONS.length - 1) {
    state.currentQ += 1;
    render();
  } else {
    state.score = state.answers.reduce((s, v) => s + v, 0);
    state.grade = getGrade(state.score);
    state.weakAreas = calcWeakAreas(state.answers);
    state.screen = 'result';
    render();
  }
}

function goToApply() {
  state.screen = 'apply';
  render();
}

function updateForm(field, value) {
  state.form[field] = value;
  if (state.errors[field]) delete state.errors[field];
  // 버튼 상태 실시간 업데이트
  const btn = document.querySelector('.btn-primary[onclick="submitApply()"]');
  if (btn) {
    const filled = state.form.name.trim() && state.form.phone.trim() && state.form.ga.trim();
    btn.disabled = !filled;
  }
}

function submitApply() {
  const errors = validateForm(state.form);
  state.errors = errors;
  if (Object.keys(errors).length > 0) { render(); return; }
  state.submitting = true;
  render();
  saveEntry({
    name: state.form.name, phone: state.form.phone,
    ga: state.form.ga, grade: state.grade,
    score: state.score, weakAreas: state.weakAreas,
    hasKakao: state.hasKakao,
  });
  setTimeout(() => {
    state.submitting = false;
    state.screen = 'complete';
    render();
  }, 800);
}

function onKakaoLinkClick() {
  state.kakaoLinkClicked = true;
}

function handleVisibilityChange() {
  if (document.visibilityState !== 'visible') return;
  if (state.screen !== 'apply') return;
  if (!state.kakaoLinkClicked || state.hasKakao) return;
  state.hasKakao = true;
  state.kakaoLinkClicked = false;
  render();
  showToast('✅ 채널 추가 확인됐어요! 당첨 확률 3배 적용!');
}

function toggleKakao() {
  state.hasKakao = !state.hasKakao;
  render();
}

function retryTest() {
  Object.assign(state, {
    screen: 'intro', currentQ: 0, answers: [], score: 0,
    grade: '', weakAreas: [], hasKakao: false,
    kakaoLinkClicked: false, errors: {},
  });
  render();
}

// ==================== INIT ====================
document.addEventListener('visibilitychange', handleVisibilityChange);
initKakao();

window.startTest        = startTest;
window.selectAnswer     = selectAnswer;
window.goToApply        = goToApply;
window.updateForm       = updateForm;
window.submitApply      = submitApply;
window.onKakaoLinkClick = onKakaoLinkClick;
window.toggleKakao      = toggleKakao;
window.retryTest        = retryTest;
window.shareKakao       = shareKakao;

render();
</script>
</body>
</html>
